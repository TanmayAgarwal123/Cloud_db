version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: donor-registry-mysql
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - donor_mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  donor_mysql_data:
